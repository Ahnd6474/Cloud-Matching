data:
  root: ""
  prepared_root: ""
  prepared_cache_shards: 4
  synthetic: false
  synthetic_length: 32
  image_size: 128
  batch_size: 4
  workers: 8
  prefetch_factor: 4
  random_crop: true
  crop_mode: native
  horizontal_flip: true

prepare:
  variants_per_image: 4
  shard_size: 256
  batch_size: 32
  workers: 8
  seed: 31

schedule:
  # Ten micro-steps replace each old step. Scaling beta by 1/10 keeps the
  # endpoint corruption essentially unchanged while exposing finer transitions.
  steps: 1000
  beta_start: 0.00001
  beta_end: 0.002
  answer_jump: 100
  adaptive_answer_jump: true
  near_clean_threshold: 200
  near_clean_answer_jump_min: 5
  near_clean_answer_jump: 20
  mid_clean_threshold: 500
  mid_clean_answer_jump_min: 20
  mid_clean_answer_jump: 50
  near_clean_probability: 0.35
  clean_answer_probability: 0.0
  goal_from_clean: true
  answer_from_current: true

corruption:
  enabled: true
  spatial_floor: 0.08
  student_t_df: 3.0
  weights:
    white_gaussian: 12.0
    local_gaussian: 3.0
    edge_gaussian: 3.0
    low_frequency_gaussian: 2.0
    high_frequency_gaussian: 4.0
    band_pass_gaussian: 2.0
    channel_correlated_gaussian: 2.0
    low_rank_gaussian: 1.0
    anisotropic_gaussian: 2.0
    signal_dependent_gaussian: 3.0

endpoint_corruption:
  enabled: false
  probability: 0.0

goal_corruption:
  enabled: true
  blur_probability: 1.0
  downsample_probability: 0.0
  mask_probability: 0.0
  minimum_scale: 0.25
  maximum_mask_fraction: 0.30

model:
  architecture: fullres_axial
  in_channels: 3
  heads: 8
  max_residual: 1.0
  noise_variance_min: 0.0001
  noise_variance_max: 2.0
  noise_variance_init: 1.0
  noise_energy_parameterization: fixed_unit
  noise_amplitude_safety_max: 8.0
  fullres_dim: 320
  fullres_depth: 12
  fullres_cross_depth: 2
  fullres_cross_gate_init: 0.5
  fullres_ffn_ratio: 2.0
  fullres_window_size: 8
  fullres_gradient_checkpointing: false
  fullres_random_attention: true
  fullres_random_slots: 64
  fullres_random_dim: 64
  fullres_random_temperature: 0.8
  fullres_random_gate1_init: 0.02
  fullres_random_gate2_init: 0.01
  fullres_random_positions: [0, 4]

loss:
  # U-statistic: self-distances exclude the zero diagonal and use S*(S-1).
  name: energy_full_band_u
  samples: 4
  sinkhorn_blur: 0.05
  full_band_levels: 3
  full_band_charbonnier_epsilon: 0.001
  full_band_high_weight: 1.0
  full_band_low_weight: 1.0
  paired_mean_weight: 1.0
  paired_deviation_weight: 1.0
  paired_variance_weight: 0.1
  perceptual_weight: 0.0
  perceptual_pretrained: true
  perceptual_stages: [1, 2, 3, 5]
  perceptual_mean_weight: 1.0
  perceptual_deviation_weight: 1.0
  spatial_ce_weight: 0.0

train:
  epochs: 30
  learning_rate: 0.00002
  lr_schedule: fixed
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: true
  amp_dtype: float16
  amp_init_scale: 1024.0
  amp_growth_interval: 2000
  channels_last: false
  tf32: true
  fused_optimizer: true
  compile: true
  compile_mode: reduce-overhead
  seed: 31
  log_every: 20
  preview_every: 200
  save_every: 1000
  output_dir: "/workspace/Cloud-Matching/outputs/l40_adaptive_gate_fast_ustat_s4_scratch"
  resume: ""
