data:
  root: data/coco2017
  prepared_root: ""
  synthetic: false
  image_size: 128
  # Per GPU; intended for two 48-GiB A6000-class devices.
  batch_size: 4
  workers: 8
  prefetch_factor: 4
  random_crop: false
  crop_mode: resized
  # COCO captions occasionally describe left/right, so keep geometry intact.
  horizontal_flip: false

text:
  enabled: true
  vocab_path: data/coco2017/coco_vocab.json
  vocab_size: 16384
  min_frequency: 2
  max_length: 48
  # Enables an unconditional path for later classifier-free guidance.
  condition_dropout: 0.10
  # The text stack starts from scratch and needs a larger LR than the generator.
  learning_rate_multiplier: 5.0

schedule:
  steps: 1000
  beta_start: 0.00001
  beta_end: 0.002
  answer_jump: 100
  adaptive_answer_jump: true
  near_clean_threshold: 200
  near_clean_answer_jump_min: 5
  near_clean_answer_jump: 20
  mid_clean_threshold: 500
  mid_clean_answer_jump_min: 20
  mid_clean_answer_jump: 50
  near_clean_probability: 0.35
  clean_answer_probability: 0.0
  goal_from_clean: true
  answer_from_current: true

corruption:
  enabled: true
  spatial_floor: 0.08
  student_t_df: 3.0
  weights:
    white_gaussian: 12.0
    local_gaussian: 3.0
    edge_gaussian: 3.0
    low_frequency_gaussian: 2.0
    high_frequency_gaussian: 4.0
    band_pass_gaussian: 2.0
    channel_correlated_gaussian: 2.0
    low_rank_gaussian: 1.0
    anisotropic_gaussian: 2.0
    signal_dependent_gaussian: 3.0

endpoint_corruption:
  enabled: false
  probability: 0.0

goal_corruption:
  enabled: false

model:
  architecture: fullres_axial
  in_channels: 3
  heads: 8
  max_residual: 1.0
  noise_variance_min: 0.0001
  noise_variance_max: 2.0
  noise_variance_init: 1.0
  noise_energy_parameterization: fixed_unit
  noise_amplitude_safety_max: 8.0
  fullres_dim: 320
  # Pooled attention replaces each old local/row/local/column cycle, so six
  # refinement FFNs are the first efficient text-conditioned configuration.
  fullres_depth: 6
  fullres_cross_depth: 2
  fullres_cross_gate_init: 0.5
  fullres_ffn_ratio: 2.0
  fullres_window_size: 8
  fullres_gradient_checkpointing: false
  # Canonical full-resolution CvT path.  Legacy names
  # pooled_attention/pooled_multiscale remain accepted for old checkpoints.
  fullres_encoder_type: cvt
  fullres_attention_type: cvt
  fullres_pooled_kernel_sizes: [3, 5, 7]
  fullres_pooled_output_sizes: [8, 4, 2]
  fullres_random_attention: true
  fullres_random_slots: 64
  fullres_random_dim: 64
  fullres_random_temperature: 0.8
  fullres_random_gate1_init: 0.02
  fullres_random_positions: [0]
  fullres_goal_condition: text
  text_vocab_size: 16384
  text_max_length: 48
  text_depth: 4
  text_heads: 8
  text_ffn_ratio: 4.0
  text_dropout: 0.1

loss:
  name: energy_full_band_u
  samples: 4
  sinkhorn_blur: 0.05
  full_band_levels: 3
  full_band_charbonnier_epsilon: 0.001
  full_band_high_weight: 1.0
  full_band_low_weight: 1.0
  paired_mean_weight: 1.0
  paired_deviation_weight: 1.0
  paired_variance_weight: 0.1
  perceptual_weight: 0.0
  spatial_ce_weight: 0.0

train:
  epochs: 30
  learning_rate: 0.00002
  lr_schedule: cosine
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: true
  amp_dtype: float16
  amp_init_scale: 1024.0
  amp_growth_interval: 2000
  channels_last: false
  tf32: true
  fused_optimizer: true
  compile: true
  compile_mode: reduce-overhead
  seed: 37
  log_every: 50
  preview_every: 0
  save_every: 0
  output_dir: outputs/coco_text_fullres_d6
  resume: ""
