data:
  root: ""
  prepared_root: ""
  prepared_cache_shards: 1
  synthetic: false
  synthetic_length: 32
  image_size: 128
  batch_size: 1
  workers: 0
  prefetch_factor: 2
  random_crop: true
  crop_mode: native
  horizontal_flip: false

prepare:
  variants_per_image: 1
  shard_size: 64
  batch_size: 1
  workers: 0
  seed: 17

schedule:
  steps: 100
  beta_start: 0.0001
  beta_end: 0.02
  answer_jump: 10
  clean_answer_probability: 1.0

corruption:
  enabled: false

endpoint_corruption:
  enabled: false
  probability: 0.0

goal_corruption:
  enabled: true
  blur_probability: 1.0
  downsample_probability: 1.0
  mask_probability: 0.15
  minimum_scale: 0.20
  maximum_mask_fraction: 0.20

model:
  architecture: fullres_axial
  in_channels: 3
  heads: 8
  max_residual: 1.0
  noise_variance_min: 0.0001
  noise_variance_max: 2.0
  noise_variance_init: 1.0
  noise_energy_parameterization: fixed_unit
  noise_amplitude_safety_max: 8.0
  fullres_dim: 320
  fullres_depth: 12
  fullres_cross_depth: 2
  fullres_ffn_ratio: 2.0
  fullres_window_size: 8
  fullres_gradient_checkpointing: true
  fullres_encoder_type: cvt
  fullres_attention_type: cvt
  fullres_pooled_kernel_sizes: [3, 5, 7]
  fullres_pooled_output_sizes: [8, 4, 2]
  fullres_random_attention: true
  fullres_random_slots: 64
  fullres_random_dim: 64
  fullres_random_temperature: 0.8
  fullres_random_gate1_init: 0.02

loss:
  name: paired_mean_deviation_full_band
  samples: 4
  full_band_levels: 3
  full_band_charbonnier_epsilon: 0.001
  full_band_high_weight: 1.0
  full_band_low_weight: 1.0
  paired_mean_weight: 1.0
  paired_deviation_weight: 1.0
  paired_variance_weight: 0.1
  perceptual_weight: 0.0
  spatial_ce_weight: 0.0

train:
  epochs: 2
  learning_rate: 0.00005
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: true
  amp_dtype: float16
  amp_init_scale: 1024.0
  amp_growth_interval: 2000
  channels_last: false
  tf32: true
  fused_optimizer: true
  compile: false
  compile_mode: reduce-overhead
  seed: 17
  log_every: 1
  preview_every: 20
  save_every: 1000
  output_dir: "outputs/local_pooledkv_random_attention_smoke"
  resume: ""
